name: Deploy hardened cloud-mail
on:
  push:
    branches: [main]
    paths: ['mail-worker/**', 'mail-vue/**', '.github/workflows/deploy-cloudflare.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-mail-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: mail-worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: mail-worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:security
      # Preserve existing D1/KV IDs and operator-managed secrets. Never recreate databases or inject JWT_SECRET.
      - run: pnpm wrangler d1 execute cloudmail --remote --config wrangler.toml --file migrations/security-auth-rate-limits.sql
      - run: pnpm wrangler deploy --config wrangler.toml --keep-vars --no-autoconfig
